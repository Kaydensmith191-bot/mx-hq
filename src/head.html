<style>
/* VOICE a pit board crossed with a wearable: calm, dark, numbers first, one tap to detail
   IDEA the board held out on the straight: one instruction, readable at a glance in sun or gym
   PICTURE the up-next card with one yellow action, then the readiness rings
   COLOUR graphite ground, plate yellow for actions and key work, green / amber / red only for recovery
   TYPE Inter Tight 800 for numbers + Inter for text
   LAYOUT phone first: rings, call, list, fuel; two columns over 960px; bottom tab bar on phone */
:root{color-scheme:dark;--bg:#0f1012;--s1:#18191c;--s2:#222428;--line:#2e3136;--ink:#f6f5f2;--mut:#9b9fa6;--go:#34d27b;--amb:#ffb020;--red:#ff4757;--acc:#ffd60a;--accInk:#141414;--blue:var(--acc);--sleep:#aab8cc}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg)}

h1,h2,h3,.num{font-family:"Inter Tight",Inter,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,4vw,env(safe-area-inset-left,0px))}
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 0 4px}
.topr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--s1);color:var(--ink);font-size:18px}
.dt{font:800 26px "Inter Tight";text-align:center;min-width:150px}
.dt small{display:block;font:500 13px Inter;color:var(--mut);letter-spacing:0}
.chip{font:600 13px Inter;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.chip b{color:var(--ink)}
.tabs{display:flex;gap:4px;margin:12px 0 4px}
.tabs a{flex:1;text-align:center;padding:10px 6px;border-radius:10px;text-decoration:none;color:var(--mut);font:600 15px Inter}
.tabs a.on{background:var(--s1);color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc)}
@media(max-width:760px){.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;margin:0;background:rgba(10,11,13,.96);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}.tabs a{font-size:13px;padding:10px 2px}}
main{padding:10px 0 40px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--s1);border-radius:16px;padding:16px;margin-bottom:12px}
.lab{font:600 12px Inter;color:var(--mut);display:block;margin-bottom:4px}
.mut{color:var(--mut);font-size:15px}
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 12px}
.dial{background:var(--s1);border-radius:16px;padding:12px 8px 10px;text-align:center;position:relative;text-decoration:none;display:block}
.dial svg{width:100%;max-width:120px;aspect-ratio:1;transform:rotate(-90deg);display:block;margin:0 auto}
.dial .trk{fill:none;stroke:var(--s2);stroke-width:9}
.dial .val{fill:none;stroke-width:9;stroke-linecap:round}
.dv{position:absolute;left:0;right:0;top:12px;aspect-ratio:1;max-width:120px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dv b{font:800 clamp(22px,6vw,32px) "Inter Tight";line-height:1}
.dv span{font:500 12px Inter;color:var(--mut)}
.dl{font:700 13px Inter;margin-top:6px;letter-spacing:.01em}
.call{display:flex;gap:12px;align-items:center;border-radius:14px;padding:13px 14px;margin-bottom:12px;font-weight:600;background:var(--s1)}
.call i{width:12px;height:12px;border-radius:50%;flex:none}
.call.g i{background:var(--go)}.call.a i{background:var(--amb)}.call.r i{background:var(--red)}.call.n i{background:var(--mut)}
.call.g{box-shadow:inset 3px 0 0 var(--go)}.call.a{box-shadow:inset 3px 0 0 var(--amb)}.call.r{box-shadow:inset 3px 0 0 var(--red)}
details.item{background:var(--s1);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.item>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
details.item>summary::-webkit-details-marker{display:none}
.tm{font:700 15px "Inter Tight";color:var(--mut)}
.it b{display:block;font:700 17px "Inter Tight"}
.it span{font-size:14px;color:var(--mut)}
.pill{font:700 12px Inter;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--s2);color:var(--mut)}
.pill.KEY{background:var(--acc);color:var(--accInk)}
.pill.HARD{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill.MOD{background:var(--s2);color:var(--ink)}
.pill.done{background:color-mix(in srgb,var(--go) 20%,transparent);color:var(--go)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mut);margin:12px 0 6px}
.stats b{color:var(--ink);font:700 17px "Inter Tight"}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0}
.exh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.exh b{font-weight:700}
.rx{font:800 17px "Inter Tight";white-space:nowrap}
.load{color:var(--ink);font-weight:600}
.cue{font-size:14px;color:var(--mut);margin:2px 0 6px}
.fin{box-shadow:inset 3px 0 0 var(--acc);padding-left:10px}
.last{font-size:13px;color:var(--mut)}
.last.up{color:var(--go);font-weight:600}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;margin-top:6px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 28px;gap:4px;align-items:center;background:var(--s2);border-radius:10px;padding:4px 6px}
.set.r{grid-template-columns:auto 28px;justify-content:space-between}
.set i{font:700 13px "Inter Tight";color:var(--mut);font-style:normal}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;min-height:42px}
.set input{border:0;background:transparent;padding:6px 2px;text-align:center;min-height:34px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--go)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:700 15px Inter;background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:11px 16px;min-height:44px;cursor:pointer}
button.ghost{background:var(--s2);color:var(--ink)}
button.warn{background:var(--red);color:#fff}
ol.steps,ul.steps{margin:6px 0 0;padding-left:20px}
ol.steps li,ul.steps li{margin:4px 0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.fields label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.bars{display:grid;gap:8px;margin:10px 0}
.br{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.br .t{height:8px;background:var(--s2);border-radius:4px;overflow:hidden}
.br .t span{display:block;height:100%;border-radius:4px}
.kc{font:800 34px "Inter Tight";line-height:1}
.chk{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.chk small{color:var(--mut);white-space:nowrap}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg a{flex:1;text-align:center;padding:9px;border-radius:9px;text-decoration:none;color:var(--mut);font-weight:600;font-size:15px}
.seg a.on{background:var(--s2);color:var(--ink)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 12px Inter;color:var(--mut)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input{min-height:34px;padding:5px;width:80px}
.fig{position:relative;height:200px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
svg:not(.tmmap):not(.gch):not(.gmap) text{font:12px Inter;fill:var(--mut)}
.note{white-space:pre-wrap}
.banner{background:var(--red);color:#fff;padding:9px 12px;border-radius:12px;margin-bottom:12px;font-weight:600}
.empty{color:var(--mut);padding:6px 0}
.tl{position:relative;height:8px;margin:10px 0 6px;background:var(--s2);border-radius:4px}
.tl span{position:absolute;top:0;bottom:0;border-radius:4px}
.tl i{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.6}
.tl b{position:absolute;top:-5px;width:4px;height:18px;background:var(--ink);border-radius:2px;margin-left:-2px}
.tll{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.wk{display:grid;gap:8px}
.wd{display:grid;grid-template-columns:84px minmax(0,1fr) 64px;gap:12px;align-items:center;background:var(--s1);border-radius:14px;padding:12px 14px;text-decoration:none}
.wd.on{box-shadow:inset 0 0 0 2px var(--acc)}
.wd b{font:700 16px "Inter Tight"}
.wd small{font-size:13px;color:var(--mut);line-height:1.35;display:block}
.wd .t{height:8px;background:var(--s2);border-radius:4px;overflow:hidden}
.wd .t span{display:block;height:100%;border-radius:4px}
.wd .t span{background:var(--mut)}
.wd .t span.k{background:var(--acc)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{display:block;text-decoration:none;background:var(--s1);border-radius:16px;padding:16px}
.tcard b{font:800 22px "Inter Tight";display:block;margin:2px 0}
.big{font:800 34px "Inter Tight";line-height:1}
.sess{border-left:3px solid var(--line);padding-left:12px;margin:14px 0}
.sess.k{border-color:var(--acc)}
.rec h2{font-size:24px}
.ing{columns:2;column-gap:20px;padding-left:18px;margin:6px 0}
@media(max-width:600px){.ing{columns:1}.dt{font-size:22px;min-width:0}.chip{display:none}.wd{grid-template-columns:70px minmax(0,1fr) 44px}}
@media(prefers-reduced-motion:no-preference){.dial .val{transition:stroke-dasharray .6s ease}}
.hero{padding:20px;background:var(--s1);border-radius:18px;margin-bottom:12px;box-shadow:inset 0 3px 0 var(--acc)}
.hero h2{font-size:30px;line-height:1.05}
.hero .go{flex:1;min-height:56px;font-size:17px}
.rcard .dials{margin:8px 0 10px;gap:4px}
.rcard .dial{background:transparent;padding:4px 0}
.rcard .rg{max-width:96px}
.rcard .call{background:var(--s2);margin:0}
.kg{font:800 44px "Inter Tight";line-height:1;color:var(--acc)}

/* ---- Lab ---- */
:root[data-skin=lab]{color-scheme:dark;--bg:#121315;--s1:#1d1e22;--s2:#28292e;--line:#36383e;--ink:#f5f5f6;--mut:#9d9fa7;--go:#2fd17a;--amb:#ffb020;--red:#ff3b4a;--acc:#ff4a12;--accInk:#ffffff;--blue:#ff4a12;--sleep:#ff8a5c}
[data-skin=lab] h1,[data-skin=lab] h2,[data-skin=lab] h3,[data-skin=lab] .kc,[data-skin=lab] .dt,[data-skin=lab] .dv b,[data-skin=lab] .it b,[data-skin=lab] .rx,[data-skin=lab] .wd b,[data-skin=lab] .big,[data-skin=lab] .tcard b,[data-skin=lab] .tm{font-family:"Space Grotesk",Inter,sans-serif;letter-spacing:-.02em}
[data-skin=lab] .card,[data-skin=lab] details.item,[data-skin=lab] .dial,[data-skin=lab] .wd,[data-skin=lab] .tcard{border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}

@media(max-width:760px){[data-skin=lab] .tabs{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:999px;background:#0a0a0b;border:0;box-shadow:0 10px 30px rgba(0,0,0,.5)}[data-skin=lab] .tabs a{color:#9d9fa7;border-radius:999px}[data-skin=lab] .tabs a.on{background:var(--acc);color:#fff;box-shadow:none}}
.filebtn{display:inline-block;background:var(--acc);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;margin-top:12px}

.gstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:10px 0 12px}

.tb{font-variant-numeric:tabular-nums}
.tm{--bg:#0d0e10;--s1:#1d1e22;--s2:#28292e;--line:#36383e;--ink:#f5f5f6;--mut:#9d9fa7;--tmA:#ff4a12;--tmB:#2ee6b0;--best:#ff4a12;--amb:#ffb020;--red:#ff5a5f;--go:#2fe37a;background:var(--bg);color:var(--ink);border-radius:24px;padding:14px;color-scheme:dark}

.tmhd{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;text-align:center;margin-bottom:12px}

<style>
/* VOICE a pit board crossed with a wearable: calm, dark, numbers first, one tap to detail
   IDEA the board held out on the straight: one instruction, readable at a glance in sun or gym
   PICTURE the up-next card with one yellow action, then the readiness rings
   COLOUR graphite ground, plate yellow for actions and key work, green / amber / red only for recovery
   TYPE Inter Tight 800 for numbers + Inter for text
   LAYOUT phone first: rings, call, list, fuel; two columns over 960px; bottom tab bar on phone */
:root{color-scheme:dark;--bg:#0f1012;--s1:#18191c;--s2:#222428;--line:#2e3136;--ink:#f6f5f2;--mut:#9b9fa6;--go:#34d27b;--amb:#ffb020;--red:#ff4757;--acc:#ffd60a;--accInk:#141414;--blue:var(--acc);--sleep:#aab8cc}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:16px/1.5 "Chakra Petch",system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.num{font-family:"Chakra Petch",sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,4vw,env(safe-area-inset-left,0px))}
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 0 4px}
.topr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--s1);color:var(--ink);font-size:18px}
.dt{font:800 26px "Chakra Petch",system-ui,sans-serif;text-align:center;min-width:150px}
.dt small{display:block;font:500 13px "Chakra Petch",system-ui,sans-serif;color:var(--mut);letter-spacing:0}
.chip{font:600 13px "Chakra Petch",system-ui,sans-serif;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.chip b{color:var(--ink)}
.tabs{display:flex;gap:4px;margin:12px 0 4px}
.tabs a{flex:1;text-align:center;padding:10px 6px;border-radius:10px;text-decoration:none;color:var(--mut);font:600 15px "Chakra Petch",system-ui,sans-serif}
.tabs a.on{background:var(--s1);color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc)}
@media(max-width:760px){.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;margin:0;background:rgba(10,11,13,.96);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}.tabs a{font-size:13px;padding:10px 2px}}
main{padding:10px 0 40px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--s1);border-radius:16px;padding:16px;margin-bottom:12px}
.lab{font:600 12px "Chakra Petch",system-ui,sans-serif;color:var(--mut);display:block;margin-bottom:4px}
.mut{color:var(--mut);font-size:15px}
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 12px}
.dial{background:var(--s1);border-radius:16px;padding:12px 8px 10px;text-align:center;position:relative;text-decoration:none;display:block}
.dial svg{width:100%;max-width:120px;aspect-ratio:1;transform:rotate(-90deg);display:block;margin:0 auto}
.dial .trk{fill:none;stroke:var(--s2);stroke-width:9}
.dial .val{fill:none;stroke-width:9;stroke-linecap:round}
.dv{position:absolute;left:0;right:0;top:12px;aspect-ratio:1;max-width:120px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dv b{font:800 clamp(22px,6vw,32px) "Chakra Petch",system-ui,sans-serif;line-height:1}
.dv span{font:500 12px "Chakra Petch",system-ui,sans-serif;color:var(--mut)}
.dl{font:700 13px "Chakra Petch",system-ui,sans-serif;margin-top:6px;letter-spacing:.01em}
.call{display:flex;gap:12px;align-items:center;border-radius:14px;padding:13px 14px;margin-bottom:12px;font-weight:600;background:var(--s1)}
.call i{width:12px;height:12px;border-radius:50%;flex:none}
.call.g i{background:var(--go)}.call.a i{background:var(--amb)}.call.r i{background:var(--red)}.call.n i{background:var(--mut)}
.call.g{box-shadow:inset 3px 0 0 var(--go)}.call.a{box-shadow:inset 3px 0 0 var(--amb)}.call.r{box-shadow:inset 3px 0 0 var(--red)}
details.item{background:var(--s1);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.item>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
details.item>summary::-webkit-details-marker{display:none}
.tm{font:700 15px "Chakra Petch",system-ui,sans-serif;color:var(--mut)}
.it b{display:block;font:700 17px "Chakra Petch",system-ui,sans-serif}
.it span{font-size:14px;color:var(--mut)}
.pill{font:700 12px "Chakra Petch",system-ui,sans-serif;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--s2);color:var(--mut)}
.pill.KEY{background:var(--acc);color:var(--accInk)}
.pill.HARD{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}

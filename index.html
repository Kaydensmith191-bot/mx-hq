<style>
/* VOICE a pit board crossed with a wearable: calm, dark, numbers first, one tap to detail
   IDEA the board held out on the straight: one instruction, readable at a glance in sun or gym
   PICTURE the up-next card with one yellow action, then the readiness rings
   COLOUR graphite ground, plate yellow for actions and key work, green / amber / red only for recovery
   TYPE Inter Tight 800 for numbers + Inter for text
   LAYOUT phone first: rings, call, list, fuel; two columns over 960px; bottom tab bar on phone */
:root{color-scheme:dark;--bg:#0f1012;--s1:#18191c;--s2:#222428;--line:#2e3136;--ink:#f6f5f2;--mut:#9b9fa6;--go:#34d27b;--amb:#ffb020;--red:#ff4757;--acc:#ffd60a;--accInk:#141414;--blue:var(--acc);--sleep:#aab8cc}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
h1,h2,h3,.num{font-family:"Plus Jakarta Sans",Inter,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 max(16px,4vw,env(safe-area-inset-left,0px))}
.top{padding:calc(14px + env(safe-area-inset-top,0px)) 0 4px}
.topr{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dnav{display:flex;align-items:center;gap:6px}
.dnav button{width:40px;height:40px;min-height:0;padding:0;border-radius:50%;background:var(--s1);color:var(--ink);font-size:18px}
.dt{font:800 26px "Plus Jakarta Sans";text-align:center;min-width:150px}
.dt small{display:block;font:500 13px Inter;color:var(--mut);letter-spacing:0}
.chip{font:600 13px Inter;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:6px 11px;white-space:nowrap}
.chip b{color:var(--ink)}
.tabs{display:flex;gap:4px;margin:12px 0 4px}
.tabs a{flex:1;text-align:center;padding:10px 6px;border-radius:10px;text-decoration:none;color:var(--mut);font:600 15px Inter}
.tabs a.on{background:var(--s1);color:var(--ink);box-shadow:inset 0 -3px 0 var(--acc)}
@media(max-width:760px){.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;margin:0;background:rgba(10,11,13,.96);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}.tabs a{font-size:13px;padding:10px 2px}}
main{padding:10px 0 40px}
.grid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--s1);border-radius:16px;padding:16px;margin-bottom:12px}
.lab{font:600 12px Inter;color:var(--mut);display:block;margin-bottom:4px}
.mut{color:var(--mut);font-size:15px}
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 12px}
.dial{background:var(--s1);border-radius:16px;padding:12px 8px 10px;text-align:center;position:relative;text-decoration:none;display:block}
.dial svg{width:100%;max-width:120px;aspect-ratio:1;transform:rotate(-90deg);display:block;margin:0 auto}
.dial .trk{fill:none;stroke:var(--s2);stroke-width:9}
.dial .val{fill:none;stroke-width:9;stroke-linecap:round}
.dv{position:absolute;left:0;right:0;top:12px;aspect-ratio:1;max-width:120px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dv b{font:800 clamp(22px,6vw,32px) "Plus Jakarta Sans";line-height:1}
.dv span{font:500 12px Inter;color:var(--mut)}
.dl{font:700 13px Inter;margin-top:6px;letter-spacing:.01em}
.call{display:flex;gap:12px;align-items:center;border-radius:14px;padding:13px 14px;margin-bottom:12px;font-weight:600;background:var(--s1)}
.call i{width:12px;height:12px;border-radius:50%;flex:none}
.call.g i{background:var(--go)}.call.a i{background:var(--amb)}.call.r i{background:var(--red)}.call.n i{background:var(--mut)}
.call.g{box-shadow:inset 3px 0 0 var(--go)}.call.a{box-shadow:inset 3px 0 0 var(--amb)}.call.r{box-shadow:inset 3px 0 0 var(--red)}
details.item{background:var(--s1);border-radius:16px;margin-bottom:10px;overflow:hidden}
details.item>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px}
details.item>summary::-webkit-details-marker{display:none}
.tm{font:700 15px "Plus Jakarta Sans";color:var(--mut)}
.it b{display:block;font:700 17px "Plus Jakarta Sans"}
.it span{font-size:14px;color:var(--mut)}
.pill{font:700 12px Inter;padding:4px 9px;border-radius:999px;white-space:nowrap;background:var(--s2);color:var(--mut)}
.pill.KEY{background:var(--acc);color:var(--accInk)}
.pill.HARD{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.pill.MOD{background:var(--s2);color:var(--ink)}
.pill.done{background:color-mix(in srgb,var(--go) 20%,transparent);color:var(--go)}
.body{padding:0 16px 16px;border-top:1px solid var(--line)}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--mut);margin:12px 0 6px}
.stats b{color:var(--ink);font:700 17px "Plus Jakarta Sans"}
.ex{border-top:1px solid var(--line);padding:12px 0}
.ex:first-child{border-top:0}
.exh{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.exh b{font-weight:700}
.rx{font:800 17px "Plus Jakarta Sans";white-space:nowrap}
.load{color:var(--ink);font-weight:600}
.cue{font-size:14px;color:var(--mut);margin:2px 0 6px}
.fin{box-shadow:inset 3px 0 0 var(--acc);padding-left:10px}
.last{font-size:13px;color:var(--mut)}
.last.up{color:var(--go);font-weight:600}
.sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:6px;margin-top:6px}
.set{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 28px;gap:4px;align-items:center;background:var(--s2);border-radius:10px;padding:4px 6px}
.set.r{grid-template-columns:auto 28px;justify-content:space-between}
.set i{font:700 13px "Plus Jakarta Sans";color:var(--mut);font-style:normal}
input,select,textarea{font:16px Inter,sans-serif;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;min-height:42px}
.set input{border:0;background:transparent;padding:6px 2px;text-align:center;min-height:34px}
input[type=checkbox]{width:22px;height:22px;min-height:0;accent-color:var(--go)}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
button{font:700 15px Inter;background:var(--acc);color:var(--accInk);border:0;border-radius:12px;padding:11px 16px;min-height:44px;cursor:pointer}
button.ghost{background:var(--s2);color:var(--ink)}
button.warn{background:var(--red);color:#fff}
ol.steps,ul.steps{margin:6px 0 0;padding-left:20px}
ol.steps li,ul.steps li{margin:4px 0}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:8px}
.fields label{font-size:12px;color:var(--mut);display:block;margin-bottom:2px}
.bars{display:grid;gap:8px;margin:10px 0}
.br{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:14px}
.br .t{height:8px;background:var(--s2);border-radius:4px;overflow:hidden}
.br .t span{display:block;height:100%;border-radius:4px}
.kc{font:800 34px "Plus Jakarta Sans";line-height:1}
.chk{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.chk small{color:var(--mut);white-space:nowrap}
.seg{display:flex;background:var(--s1);border-radius:12px;padding:4px;gap:4px;margin-bottom:12px}
.seg a{flex:1;text-align:center;padding:9px;border-radius:9px;text-decoration:none;color:var(--mut);font-weight:600;font-size:15px}
.seg a.on{background:var(--s2);color:var(--ink)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font:600 12px Inter;color:var(--mut)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td input{min-height:34px;padding:5px;width:80px}
.fig{position:relative;height:200px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
svg:not(.tmmap):not(.gch):not(.gmap) text{font:12px Inter;fill:var(--mut)}
.note{white-space:pre-wrap}
.banner{background:var(--red);color:#fff;padding:9px 12px;border-radius:12px;margin-bottom:12px;font-weight:600}
.empty{color:var(--mut);padding:6px 0}
.tl{position:relative;height:8px;margin:10px 0 6px;background:var(--s2);border-radius:4px}
.tl span{position:absolute;top:0;bottom:0;border-radius:4px}
.tl i{position:absolute;top:-3px;width:2px;height:14px;background:var(--ink);opacity:.6}
.tl b{position:absolute;top:-5px;width:4px;height:18px;background:var(--ink);border-radius:2px;margin-left:-2px}
.tll{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mut);flex-wrap:wrap}
.wk{display:grid;gap:8px}
.wd{display:grid;grid-template-columns:84px minmax(0,1fr) 64px;gap:12px;align-items:center;background:var(--s1);border-radius:14px;padding:12px 14px;text-decoration:none}
.wd.on{box-shadow:inset 0 0 0 2px var(--acc)}
.wd b{font:700 16px "Plus Jakarta Sans"}
.wd small{font-size:13px;color:var(--mut);line-height:1.35;display:block}
.wd .t{height:8px;background:var(--s2);border-radius:4px;overflow:hidden}
.wd .t span{display:block;height:100%;border-radius:4px}
.wd .t span{background:var(--mut)}
.wd .t span.k{background:var(--acc)}
.tlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.tcard{display:block;text-decoration:none;background:var(--s1);border-radius:16px;padding:16px}
.tcard b{font:800 22px "Plus Jakarta Sans";display:block;margin:2px 0}
.big{font:800 34px "Plus Jakarta Sans";line-height:1}
.sess{border-left:3px solid var(--line);padding-left:12px;margin:14px 0}
.sess.k{border-color:var(--acc)}
.rec h2{font-size:24px}
.ing{columns:2;column-gap:20px;padding-left:18px;margin:6px 0}
@media(max-width:600px){.ing{columns:1}.dt{font-size:22px;min-width:0}.chip{display:none}.wd{grid-template-columns:70px minmax(0,1fr) 44px}}
@media(prefers-reduced-motion:no-preference){.dial .val{transition:stroke-dasharray .6s ease}}
.hero{padding:20px;background:var(--s1);border-radius:18px;margin-bottom:12px;box-shadow:inset 0 3px 0 var(--acc)}
.hero h2{font-size:30px;line-height:1.05}
.hero .go{flex:1;min-height:56px;font-size:17px}
.rcard .dials{margin:8px 0 10px;gap:4px}
.rcard .dial{background:transparent;padding:4px 0}
.rcard .rg{max-width:96px}
.rcard .call{background:var(--s2);margin:0}
.kg{font:800 44px "Plus Jakarta Sans";line-height:1;color:var(--acc)}

/* ---- Lab ---- */
:root[data-skin=lab]{color-scheme:dark;--bg:#121315;--s1:#1d1e22;--s2:#28292e;--line:#36383e;--ink:#f5f5f6;--mut:#9d9fa7;--go:#2fd17a;--amb:#ffb020;--red:#ff3b4a;--acc:#ff4a12;--accInk:#ffffff;--blue:#ff4a12;--sleep:#ff8a5c}
[data-skin=lab] h1,[data-skin=lab] h2,[data-skin=lab] h3,[data-skin=lab] .kc,[data-skin=lab] .dt,[data-skin=lab] .dv b,[data-skin=lab] .it b,[data-skin=lab] .rx,[data-skin=lab] .wd b,[data-skin=lab] .big,[data-skin=lab] .tcard b,[data-skin=lab] .tm{font-family:"Plus Jakarta Sans",Inter,sans-serif;letter-spacing:-.02em}
[data-skin=lab] .card,[data-skin=lab] details.item,[data-skin=lab] .dial,[data-skin=lab] .wd,[data-skin=lab] .tcard{border-radius:22px;box-shadow:inset 0 1px 0 rgba(255,255,255,.04)}
[data-skin=lab] .rcard .dial{box-shadow:none}

[data-skin=lab] .hero .lab,[data-skin=lab] .hero .stats{color:rgba(255,255,255,.8)}
[data-skin=lab] .hero .stats b{color:#fff}
[data-skin=lab] .hero .go:not(.ghost){background:#fff;color:var(--acc)}
[data-skin=lab] .hero .ghost{background:rgba(255,255,255,.16);color:#fff}
[data-skin=lab] .hero .pill{background:rgba(255,255,255,.2);color:#fff;box-shadow:none}
[data-skin=lab] button{border-radius:999px}
[data-skin=lab] .pill.KEY{background:var(--acc);color:#fff}
[data-skin=lab] .call{border-radius:16px}
[data-skin=lab] .set{border-radius:14px}
[data-skin=lab] .dt{font-size:28px}

@media(max-width:760px){[data-skin=lab] .tabs{left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:999px;background:#0a0a0b;border:0;box-shadow:0 10px 30px rgba(0,0,0,.5)}[data-skin=lab] .tabs a{color:#9d9fa7;border-radius:999px}[data-skin=lab] .tabs a.on{background:var(--acc);color:#fff;box-shadow:none}}
.filebtn{display:inline-block;background:var(--acc);color:#fff;border-radius:999px;padding:11px 20px;font-weight:700;cursor:pointer;margin-top:12px}
.vh{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden;pointer-events:none}
.gstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:10px 0 12px}

.gnote li{margin-bottom:7px}
.tb{font-variant-numeric:tabular-nums}
.tm{--bg:#0d0e10;--s1:#1d1e22;--s2:#28292e;--line:#36383e;--ink:#f5f5f6;--mut:#9d9fa7;--tmA:#ff4a12;--tmB:#2ee6b0;--best:#ff4a12;--amb:#ffb020;--red:#ff5a5f;--go:#2fe37a;background:var(--bg);color:var(--ink);border-radius:24px;padding:14px;color-scheme:dark}

.tmhd{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;text-align:center;margin-bottom:12px}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="shim.js"></script>
<script>
{

const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const MS=864e5;
const toN=s=>Date.UTC(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10))/MS;
const toS=n=>new Date(n*MS).toISOString().slice(0,10);
const dow=s=>{const d=new Date(toN(s)*MS).getUTCDay();return d===0?7:d};
const DN=['','Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MN=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nice=s=>DN[dow(s)]+' '+(+s.slice(8,10))+' '+MN.at(+s.slice(5,7)-1);
const todayS=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const START='2026-11-28',END='2027-11-25';
const RACES=[['2027-02-05','Warm-up race'],['2027-02-20','Round 1'],['2027-03-21','Round 2'],['2027-04-11','Round 3'],['2027-05-02','Round 4'],['2027-05-16','Round 5'],['2027-06-06','Round 6'],['2027-07-11','Round 7'],['2027-08-08','Round 8'],['2027-09-19','Round 9']];
const PH=[['2026-11-28','2026-12-20','Build','#111'],['2026-12-21','2026-12-27','Deload','#8a8a86'],['2026-12-28','2027-01-24','Strength + power','#e4002b'],['2027-01-25','2027-02-19','Taper','#111'],['2027-02-20','2027-09-19','Race season','#3a3a3a'],['2027-09-20','2027-10-10','Rest','#8a8a86'],['2027-10-11','2027-11-25','Off-season','#5c5c58']];

/* ---------- state ---------- */
const S={days:{},track:{},tracks:{},reviews:{},gpsx:{},prof:{},view:'today',date:null,trk:null,tk:null,db:null,msg:'',del:null};
S.date=toN(todayS())<toN(START)?START:todayS();

/* ---------- phase logic ---------- */
function ctx(s){
  const n=toN(s),w=dow(s),c={s,n,w,mode:'p1',wk:1,k:null,race:null,label:''};
  for(const [r,name] of RACES){const k=toN(r)-n;if(k>=-1&&k<=6){c.k=k;c.race=name;break}}
  const wkOf=a=>Math.floor((n-toN(a))/7)+1;
  if(n<toN(START)){c.mode='pre';c.label='Starts Sat 28 Nov'}
  else if(n<=toN('2026-12-01')){c.mode='test';c.label='Week 1 · Testing'}
  else if(n<=toN('2026-12-20')){c.mode='p1';c.wk=wkOf('2026-11-30');c.label='Phase 1 · Build · Week '+c.wk}
  else if(n<=toN('2026-12-27')){c.mode='dl';c.label='Deload week'}
  else if(n<=toN('2027-01-24')){c.mode='p2';c.wk=wkOf('2026-12-28');c.label='Phase 2 · Strength + power · Week '+c.wk}
  else if(n<=toN('2027-02-19')){c.mode='p3';c.wk=wkOf('2027-01-25');c.label='Phase 3 · Sharpen + taper · Week '+c.wk}
  else if(n<=toN('2027-09-19')){
    let prev=null,next=null;for(const [r] of RACES){const rn=toN(r);if(rn<=n)prev=rn;else if(next===null)next=rn}
    if(prev!==null&&next!==null&&prev>=toN('2027-06-06')&&next-prev>=28){c.mode='mini';c.wk=(Math.floor(Math.max(0,n-prev-1)/7)%4)+1;c.label='In-season · Mini-build · Week '+c.wk}
    else{c.mode='in';c.wk=Math.floor((n-toN('2027-02-22'))/7)+1;c.label='In-season · Maintenance'}
  }
  else if(n<=toN('2027-10-10')){c.mode='tr';c.label='Transition · Active rest'}
  else{c.wk=(Math.floor((n-toN('2027-10-11'))/7)%4)+1;c.mode=c.wk===4?'dl':'off';c.label='Off-season build · Week '+c.wk}
  return c;
}
const big=m=>m==='p2'||m==='mini';
const hardBlock=m=>m==='p1'||m==='p2'||m==='mini'||m==='off';
function pctFor(m,wk){
  if(m==='dl')return .6;if(m==='p3')return .85;if(m==='in')return .78;if(m==='race')return .75;
  if(big(m))return [.8,.825,.85,.875].at(Math.min(wk,4)-1);
  return [.7,.725,.75,.75].at(Math.min(wk,4)-1);
}
const TS={EASY:1,MOD:2,HARD:3,KEY:4};
const tierHTML=t=>t?'<span class="tier '+t+'"><span class="m">'+[1,2,3,4].map(i=>'<u class="'+(i<=TS[t]?'f':'')+'"></u>').join('')+'</span>'+({EASY:'Easy',MOD:'Moderate',HARD:'Hard',KEY:'Key session'}[t])+'</span>':'';

/* ---------- exercise library ---------- */
const E=(id,name,sets,reps,load,rest,cue,o)=>({id,name,sets,reps,load,rest,cue,...(o||{})});
const MAXHR=()=>+S.prof.maxHR||200;
const hr=(a,b)=>Math.round(MAXHR()*a)+'–'+Math.round(MAXHR()*b)+' bpm';
const bench=(k)=>{const b=(S.prof.bench||{})[k]||{};for(const p of ['oct','jun','jan','wk1'])if(+b[p]>0)return +b[p];return 0};
function e1(of){
  if(of==='squat'){const v=bench('squat');return v?v*1.1:0}
  if(of==='trap'){const v=bench('trap');return v?v*1.1:0}
  const t=S.prof.tests||{};
  if(of==='ohp')return +t.ohp>0?t.ohp*1.167:0;
  if(of==='bench')return +t.bench>0?t.bench*1.267:0;
  return 0;
}
function loadTxt(l){
  if(typeof l==='string'){const r=l.match(/RPE (\d)/);if(r&&!/kg/.test(l)&&!/weight/.test(l))return l+': a weight you could lift '+(10-+r[1])+' more reps with';if(l==='Light')return 'Light: a weight you could do 10+ more reps with';if(l==='Light band or plate')return 'Light band, or a 2.5–5 kg plate';if(l==='Light band')return 'Light resistance band';return l}
  const v=e1(l.of);
  if(v>0){const st=l.step||2.5;const kg=Math.round(v*l.pct/st)*st;return (Number.isInteger(kg)?kg:kg.toFixed(1))+' kg'+(l.note?' '+l.note:'')}
  return 'RPE 7–8 · '+(l.of==='squat'||l.of==='trap'?'kg appear after your week 1 test':'add your test in Profile for kg');
}
const CORE={
  1:[E('c_abw','Core: ab wheel',3,'10','Bodyweight','45 s','Ribs down, no arch.'),E('c_db','Core: dead bug',3,'8 each side','Bodyweight','45 s','Low back pressed into the floor.')],
  2:[E('c_suit','Core: suitcase carry',3,'30 m each side',{pct:.25,of:'trap',step:2,note:'one hand'},'45 s','Stay tall, don\'t lean.'),E('c_ph','Core: Pallof hold',3,'20 s each side','RPE 7','45 s','Arms locked out, resist the turn.')],
  3:[E('c_sp','Core: side plank',3,'Max minus 10 s each side','Bodyweight','45 s','Straight line, hips high.')],
  4:[E('c_rot','Core: med-ball rotational throw',3,'6 each side','4–6 kg ball','45 s','Turn from the hips, throw hard into the wall.'),E('c_hlr','Core: hanging leg raise',3,'Max','Bodyweight','60 s','No swing.')]
};
function finisher(key,m){
  if(!hardBlock(m))return null;const p2=big(m);
  if(key==='A')return E('fin_a','Finisher: bike + hold',p2?8:6,'Air bike: 30 s all-out ('+hr(.9,1)+') → 30 s attack-position hold with dumbbells','Max effort','45 s','The hard part of the day. Legs will be gone: hold the position anyway. Last round: hold the attack position until you physically cannot. Log the time.',{rounds:true,fin:true});
  if(key==='D')return E('fin_d','Finisher: arm-pump killer',p2?5:4,'60 s gripper → 30 s dead hang → 20 push-ups','Light gripper','45 s','Forearms full of pump: relax the grip between, breathe through it. Last round: dead hang until your hands open. Lap 12 feels like this.',{rounds:true,fin:true});
  return null;
}
function DIGDEEP(m){const p2=big(m);return {title:'Dig Deep · 30 min + 2 laps',dd:true,rows:[
  {id:'dd0',label:'The rules',detail:'30 minutes continuous, then 2 laps. No sitting down, no phone. If you stop moving, 5 burpees before you carry on. When your mind says you are done, do 10 more reps: that gap is what you are training.'},
  {id:'dd1',label:'One round = 6 stations, about 4 min',detail:'1 Air bike 60 s at '+hr(.88,.93)+' · 2 Kettlebell swings × '+(p2?15:12)+' · 3 Farmer\'s carry 2 × 20 m · 4 Lateral bounds × 10 · 5 Attack-position hold 30 s, dumbbells at bar height · 6 Burpee box jumps × '+(p2?8:6)},
  {id:'dd2',label:'Minutes 0–10: settle in at '+hr(.82,.88),detail:'Smooth and steady. Count your rounds.',secs:600,fields:[['r','Rounds done'],['hr','Avg HR']]},
  {id:'dd3',label:'Minutes 10–20: hold the pace at '+hr(.85,.9),detail:'This is where you want to slow down. Don\'t. Same reps, same speed.',secs:600,fields:[['r','Rounds done'],['hr','Avg HR']]},
  {id:'dd4',label:'Minutes 20–30: race the clock at '+hr(.88,.95),detail:'Your body has more than your mind thinks. Pick up the pace.',secs:600,fields:[['r','Rounds done'],['hr','Avg HR']]},
  {id:'dd5',label:'Lap 1: air bike, 2 min all-out',detail:'30 s walk, then straight into lap 2',secs:120,fields:[['cal','Cals'],['hr','Max HR']]},
  {id:'dd6',label:'Lap 2: air bike, 2 min all-out',detail:'Beat lap 1. This is the last 2 laps of a moto.',secs:120,fields:[['cal','Cals'],['hr','Max HR']]},
  {id:'dd7',label:'Log your total',detail:'Total rounds + both laps\' cals. Beat it next week. Stop only for sharp pain, dizziness or chest pain: pushing through fatigue is the point, pushing through injury is not.',fields:[['tot','Total rounds'],['score','Total cals']]}]}}
function strength(key,m,wk){
  const p2=big(m),P=pctFor(m==='dl'?'dl':(m==='off'?'p1':m),wk);
  const L={
  A:()=>[E('squat','Back squat',p2?5:4,p2?'3–5':'6–8',{pct:P,of:'squat'},'2–3 min','Brace, sit between your heels, drive up hard. Stop 2 reps short.'),
    p2&&E('jsq','Jump squat',4,'5','Bodyweight or 2 × 10 kg DBs','90 s','Land soft and quiet, reset every rep.'),
    E('rdl','Romanian deadlift',3,p2?'6':'8',{pct:p2?.55:.5,of:'trap'},'2 min','Hinge back, bar close, flat back, feel the hamstrings.'),
    E('bss','Bulgarian split squat',3,p2?'6 each leg':'8 each leg',{pct:p2?.22:.18,of:'squat',step:2,note:'per hand'},'90 s','Front shin near vertical, slow down, drive up.'),
    E('aph','MX: attack-position squat hold',3,p2?'60 s':'45 s',{pct:p2?.15:.12,of:'squat',step:2,note:'per hand'},'60 s','Dumbbells at bar height, elbows up, chest over the bars, knees bent. Breathe.'),
    E('calf','MX: single-leg calf raise off a step',3,p2?'20–25 each':'15 each','Bodyweight','45 s','Full stretch at the bottom, 1 s pause at the top.'),
    E('hlr','Hanging leg raise',3,'12','Bodyweight','60 s','No swing. Knees to chest, lower slowly.'),
    E('pallof','Pallof press',3,'10 each side','RPE 7','45 s','Press out, hold 2 s, don\'t let it twist you.')],
  B:()=>[E('pull','Pull-up',p2?5:4,p2?'4–6':'6–8',p2?'Add weight · RPE 8':'Bodyweight · RPE 8','2–3 min','Start from a dead hang, chin over the bar, 2 s down.'),
    E('csrow','Chest-supported row',4,p2?'6':'8','RPE 8','2 min','Squeeze the shoulder blades, no bounce.'),
    E('arow','MX: single-arm band or cable row in attack position',3,p2?'12 each arm':'10 each arm','RPE 7','60 s','Hold attack position; row without twisting.'),
    E('face','Face pull',3,'15','Light','60 s','Pull to your forehead, thumbs back.'),
    E('farm','Farmer\'s carry',4,'40 m',{pct:p2?.32:.28,of:'trap',step:2,note:'per hand'},'90 s','Tall, shoulders down, grip as relaxed as you can.'),
    E('hang','Dead hang',3,'Max time','Bodyweight','90 s','Shoulders engaged, breathe, relax the forearms.'),
    E('neck','Neck, 4 directions',p2?3:2,p2?'12 each way':'15 each way','Light band or plate','45 s','Slow and controlled. Never jerk.')],
  C:()=>[E('box','Box jump',p2?5:4,p2?'3':'4',p2?'Higher box':'Knee-height box','90 s','First, while fresh. Step down, never jump down.'),
    E('drop','MX: drop landing into attack position',3,p2?'5':'4',p2?'Higher box':'Low box','60 s','Step off, land and freeze 2 s in attack position.'),
    E('trap','Trap-bar deadlift',p2?5:4,p2?'3':'5',{pct:P+(p2?.03:.05),of:'trap'},'2–3 min','Push the floor away, lock the hips, flat back.'),
    E('lat','MX: lateral bound and stick',3,p2?'6 each side':'5 each side','Bodyweight','60 s','Jump sideways, stick on one leg for 2 s.'),
    E('slrdl','Single-leg RDL',3,p2?'6 each leg':'8 each leg','RPE 7','60 s','Hips square, reach long.'),

function tilesSVG(P,x0,y0,w,h,zb){const ll=(x,y)=>P.inv(x,-y),nw=ll(x0,y0),se=ll(x0+w,y0+h),mpp=w/1100;
  let z=Math.round(Math.log2(156543.03*Math.cos(P.la0*Math.PI/180)/mpp))+(zb||0);z=Math.max(12,Math.min(19,z));
  const rng=z=>{const n=2**z,tx=lo=>(lo+180)/360*n,ty=la=>{const r=la*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n};return [Math.floor(tx(nw[1])),Math.floor(tx(se[1])),Math.floor(ty(nw[0])),Math.floor(ty(se[0]))]};
  let r=rng(z);while((r[1]-r[0]+1)*(r[3]-r[2]+1)>90&&z>12){z--;r=rng(z)}
  const n=2**z,lon2=t=>t/n*360-180,lat2=t=>180/Math.PI*Math.atan(Math.sinh(Math.PI-2*Math.PI*t/n));let s='';
  for(let X=r[0];X<=r[1];X++)for(let Y=r[2];Y<=r[3];Y++){const a=P.f(lat2(Y),lon2(X)),b=P.f(lat2(Y+1),lon2(X+1));
    s+='<image href="https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/'+z+'/'+Y+'/'+X+'" x="'+a[0].toFixed(2)+'" y="'+(-a[1]).toFixed(2)+'" width="'+(b[0]-a[0]+0.5).toFixed(2)+'" height="'+(a[1]-b[1]+0.5).toFixed(2)+'" preserveAspectRatio="none"/>'}
  return s}

    if(pts){const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);x0=Math.min(...xs)-50;y0=Math.min(...ys)-50;w=Math.max(...xs)-x0+50;h=Math.max(...ys)-y0+50}else{x0=-450;y0=-320;w=900;h=640}

function weekScore(mon){let pl=0,dn=0,ci=0,sl=0,days=0;for(let i=0;i<7;i++){const s=toS(mon+i);if(s>todayS())break;days++;const p=plan(s),d=S.days[s]||{};pl+=(p.am?1:0)+(p.pm?1:0);dn+=(d.done&&d.done.am?1:0)+(d.done&&d.done.pm?1:0);if(+getK(d,'whoop.rec')>0)ci++;if(+getK(d,'whoop.sleep')>=8)sl++}return {pl,dn,ci,sl,days}}

(async()=>{try{const dk=window.claude&&window.claude.use?await window.claude.use('desktop'):null;if(dk&&dk.app&&dk.app.dock){const r=await dk.app.dock.setIcon(ICON);S.iconWritten=r&&r.written}}catch(e){S.iconErr=String(e&&e.message||e)}})();
function loadLocal(){try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith('mx:'))continue;const [,col,id]=k.split(/[:/]/);const v=JSON.parse(localStorage.getItem(k));if(col==='profile')S.prof=v;else if(BOX[col])S[BOX[col]][id]=v}}catch(e){}}
route();
(async()=>{
  let db=null;try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  try{S.sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){S.sample=null}
  try{const dk=window.claude&&window.claude.use?await window.claude.use('desktop'):null;S.desk=dk;S.canInstall=!!(dk&&dk.install&&await dk.install.state()==='available');if(S.canInstall)render()}catch(e){S.canInstall=false}
  if(!db){loadLocal();S.msg='Saving on this device only. Open this page signed in to claude.ai to sync to your account.';render();return}
  S.db=db;
  const timer=setTimeout(()=>{S.msg='Your data can\'t be reached yet. Check your connection.';renderMsg()},10000);
  const clear=()=>{clearTimeout(timer);if(S.msg.startsWith('Your data'))S.msg='';};
  const sub=(col)=>db.collection(col).onSnapshot(snap=>{if(!snap.metadata.fromCache)clear();const box=S[BOX[col]];snap.docChanges().forEach(ch=>{const id=ch.doc.id;if(pend[col+'/'+id]||busy[col+'/'+id])return;if(ch.type==='removed'){delete box[id];return}box[id]=JSON.parse(JSON.stringify(ch.doc.data()||{}))});render()},()=>{clear();S.msg='Live sync stopped. Reload the page.';renderMsg()});
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(!k.startsWith('mxq:'))continue;const path=k.slice(4),v=JSON.parse(localStorage.getItem(k));if(!v||v.__del)continue;const [col,id]=path.split('/');if(col==='profile')S.prof=v;else if(BOX[col])S[BOX[col]][id]=v;pend[path]=v;flush(path)}}catch(e){}
  sub('days');sub('track');sub('tracks');sub('reviews');sub('gps');
  db.doc('profile/main').onSnapshot(snap=>{clear();if(!pend['profile/main']&&!busy['profile/main'])S.prof=snap.exists?JSON.parse(JSON.stringify(snap.data())):{};render()},()=>{});
})();
